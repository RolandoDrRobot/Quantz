<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070e1c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050816;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#33dcff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle cyan border -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#00D4FF" stroke-width="6" stroke-opacity="0.3"/>
  <!-- Q circle (outer ring) -->
  <circle cx="256" cy="245" r="148" fill="none" stroke="url(#cyan)" stroke-width="36"/>
  <!-- Q tail (diagonal stroke) -->
  <line x1="348" y1="322" x2="416" y2="396" stroke="url(#cyan)" stroke-width="36" stroke-linecap="round"/>
</svg>
