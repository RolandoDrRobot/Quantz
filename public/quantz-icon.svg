<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071408;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030b06;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b89b28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7d1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle gold border -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#b89b28" stroke-width="6" stroke-opacity="0.4"/>
  <!-- Q circle (outer ring) -->
  <circle cx="256" cy="245" r="148" fill="none" stroke="url(#gold)" stroke-width="36"/>
  <!-- Q tail (the diagonal stroke of Q) -->
  <line x1="348" y1="322" x2="416" y2="396" stroke="url(#gold)" stroke-width="36" stroke-linecap="round"/>
</svg>
